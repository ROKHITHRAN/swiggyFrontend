<div class="home-container">
    <div class="search-box">
        <img src="assets/icons/search.svg" class="search-icon">
        <input type="text" class="search" placeholder="Search for area, street name..">
    </div>
    <div class="carousel">
        <div>
        <span class="carousel-heading">Popular Cuisines</span>
        </div>
        <div class="carousel-body">
           <div class="card" *ngFor="let item of items">
            <img src={{item}} alt="Food Item" >
        </div>
        </div>
    </div>
</div>

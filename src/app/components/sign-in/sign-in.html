<div class="signIn-container">
  <div class="sign-header">
    <div class="log-or-sign">
      <span>
        {{ signType }}
      </span>
      <div class="sign-btn-con">
        or
        <button class="sign-btn" (click)="ToggleLogin()">
          @if (signType === 'Login') {
            <span>SignUp</span>
          } @else {
            <span>Login</span>
          }
        </button>
      </div>
    </div>
    <div class="sign-img">
      <img src="assets/images/Image-login_btpq7r.avif" />
    </div>
  </div>
  <div class="line-break"></div>
  <form #formRef="ngForm" class="sign-form" (ngSubmit)="OnSubmit()">
    @if (signType === 'Login') {
      <div class="form-floating mb-3">
        <input
          type="email"
          class="form-control"
          id="email"
          placeholder="name@example.com"
          [(ngModel)]="loginData.email"
          name="email"
          required
        />
        <label for="email">Email address</label>
      </div>
      <div class="form-floating mb-3">
        <input
          type="password"
          class="form-control"
          id="password"
          placeholder="name@example.com"
          name="password"
          [(ngModel)]="loginData.password"
          required
        />
        <label for="password">Password</label>
      </div>
    } @else {
      <div class="form-floating mb-3">
        <input
          type="email"
          class="form-control"
          id="email"
          placeholder="name@example.com"
          [(ngModel)]="registerData.email"
          name="email"
          required
        />
        <label for="email">Email address</label>
      </div>
      <div class="form-floating mb-3">
        <input
          type="password"
          class="form-control"
          id="password"
          placeholder="name@example.com"
          [(ngModel)]="registerData.password"
          name="password"
          required
        />
        <label for="password">Password</label>
      </div>
      <div class="form-floating mb-3">
        <input
          type="text"
          class="form-control"
          id="phone"
          placeholder="name@example.com"
          [(ngModel)]="registerData.phoneNumber"
          name="phoneNumber"
          required
        />
        <label for="phone">Phone Number</label>
      </div>
      <div class="form-floating mb-3">
        <input
          type="text"
          class="form-control"
          id="name"
          placeholder="name@example.com"
          [(ngModel)]="registerData.name"
          name="name"
          required
        />
        <label for="name">Name</label>
      </div>
    }
    <button class="btn btn-primary" type="submit" [disabled]="formRef.invalid">
      {{ signType }}
    </button>
    <span
      >By clicking on Login, I accept the <strong>Terms & Conditions & Privacy Policy</strong></span
    >
  </form>
</div>
